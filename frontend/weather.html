<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌤️ SmartNavFish - Weather</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-brand">
      <img src="file.svg" style="width: 50px; height: 50px;">
      <h1><a href="index.html">SmartNavFish</a></h1>
    </div>
    <nav class="navbar-nav">
      <a href="index.html" class="nav-item">Home</a>
      <a href="route.html" class="nav-item">Route Planner</a>
      <a href="predict.html" class="nav-item">Prediction</a>
      <a href="weather.html" class="nav-item active">Weather</a>
      <a href="sos.html" class="nav-item nav-item--accent">SOS</a>
    </nav>
  </header>

  <main class="main-content main-content--center">
    <div class="card card--wide">
      <h2 class="card-title"><i class="fas fa-cloud-sun"></i> Weather Forecast</h2>
      <p class="card-subtitle">Get the latest weather conditions for your location.</p>
      
      <div class="weather-form">
        <div class="form-group">
          <label for="city-input">Enter City Name:</label>
          <input type="text" id="city-input" placeholder="e.g., Kochi" />
        </div>
        <div class="button-group">
          <button id="get-weather-btn" class="btn btn--primary">
            <i class="fas fa-search"></i> Get Weather
          </button>
        </div>
      </div>
      
      <div id="weather-result" class="weather-result-container">
        <p>Enter a city to get the weather forecast.</p>
      </div>
    </div>
  </main>

  <script src="./scripts/weather.js"></script>
</body>
</html>
