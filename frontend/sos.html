<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚨 SmartNavFish - Emergency SOS</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-brand">
      <img src="file.svg" style="width: 50px; height: 50px;">
      <h1><a href="index.html">SmartNavFish</a></h1>
    </div>
    <nav class="navbar-nav">
      <a href="index.html" class="nav-item">Home</a>
      <a href="route.html" class="nav-item">Route Planner</a>
      <a href="predict.html" class="nav-item">Prediction</a>
      <a href="weather.html" class="nav-item">Weather</a>
      <a href="sos.html" class="nav-item active nav-item--accent">SOS</a>
    </nav>
  </header>

  <main class="main-content main-content--center">
    <div class="card card--danger">
      <div class="card-icon"><i class="fas fa-exclamation-triangle"></i></div>
      <h2 class="card-title">Emergency SOS</h2>
      <p class="card-subtitle">In case of an emergency, click the button below to send an alert to your designated contacts and emergency services with your current location.</p>
      
      <div class="form-group">
        <label for="message">Add a brief message (optional):</label>
        <textarea id="message" placeholder="e.g., 'Engine failure near shore.'"></textarea>
      </div>

      <div class="coords-display">
        <p>Your current coordinates:</p>
        <span id="coordinates">Loading...</span>
      </div>

      <div class="button-group">
        <button id="sendSosBtn" class="btn btn--danger btn--lg">
          <i class="fas fa-bullhorn"></i> Send SOS Alert
        </button>
      </div>
    </div>
  </main>
  
  <script src="./scripts/api.js"></script>
  <script src="./scripts/sos.js"></script>
</body>
</html>
