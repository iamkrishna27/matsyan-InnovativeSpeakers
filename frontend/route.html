<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartNavFish - Route Planner</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-brand">
      <img src="file.svg" style="width: 50px; height: 50px;">
      <h1><a href="index.html">SmartNavFish</a></h1>
    </div>
    <nav class="navbar-nav">
      <a href="index.html" class="nav-item">Home</a>
      <a href="route.html" class="nav-item active">Route Planner</a>
      <a href="predict.html" class="nav-item">Prediction</a>
      <a href="weather.html" class="nav-item">Weather</a>
      <a href="sos.html" class="nav-item nav-item--accent">SOS</a>
    </nav>
  </header>

  <div class="app-container">
    <div class="main-content main-content--split">
      <aside class="sidebar">
        <div class="control-panel">
          <h2 class="panel-title"><i class="fas fa-map-marker-alt"></i> Plan Your Route</h2>
          <div class="form-group">
            <label for="start">Start Location</label>
            <input type="text" id="start" value="Current Location" disabled>
          </div>
          <div class="form-group">
            <label for="destination">Fishing Zone</label>
            <select id="destination">
              <option value="">Select a fishing zone...</option>
            </select>
          </div>
          <div class="button-group">
            <button id="calculate-route" class="btn btn--primary">
              <i class="fas fa-route"></i> Calculate Route
            </button>
          </div>
        </div>
        <div id="route-info" class="route-info">
          <div class="panel-title"><i class="fas fa-info-circle"></i> Route Details</div>
          <p>Route information will appear here after calculation.</p>
        </div>
        <div class="sidebar-footer">
          <button id="save-route" class="btn btn--secondary btn--sm"><i class="fas fa-save"></i> Save Route</button>
          <button id="clear-route" class="btn btn--secondary btn--sm"><i class="fas fa-times"></i> Clear Route</button>
        </div>
      </aside>

      <div class="map-container">
        <div id="map"></div>
      </div>
    </div>
  </div>

  <script src="https://maps.googleapis.com/maps/api/js?key=&callback=initMap" async defer></script>
  <script src="./scripts/route.js"></script>

</body>
</html>
